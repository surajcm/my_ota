server:
  port:
    8090

spring:
  application:
    name:
      MyOtaApp
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true

logging:
  level:
    com:
      online:
        travel:
          INFO
  file:
    clean-history-on-start:
      true
    name:
      logs/${spring.application.name}.log  

application-description:
  @project.description@
application-version:
  @project.version@
springdoc.use-fqn:
  true

air:
  shop:
    url:
      http://iata.api.mashery.com/athena/ndc192api
    maxOffers: 25
    maxSegments: 25
  offer:
    url:
      http://iata.api.mashery.com/athena/ndc192api